name: Fork release (Windows)

# Builds an unsigned Windows x64 installer of this fork, plus the SketchUp
# extension as a .rbz, and publishes both as GitHub Release v<version>.
# Builds natively on Windows, so unlike release.yml it needs no Linux job and
# ships without the embedded WSL runtime.
#
#   gh workflow run fork-release-windows.yml --ref <branch> -f version=1.2.3

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, plain X.Y.Z (published as tag vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fork-release-windows
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows x64
    if: github.repository == 'eduardtomas1/t3code'
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be plain X.Y.Z, got '$VERSION'."
            exit 1
          fi

      - name: Enable long paths
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # setup-vp's own cache restores a Linux-shaped store on Windows, which is
      # slower than no cache (see windows-tests.yml).
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      # The desktop build's Windows preflight requires Python 3 for node-gyp.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      # The desktop build reuses this binary from
      # native/resource-monitor/target/<rust target>/release when
      # T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR is set.
      - name: Build resource monitor
        shell: bash
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-pc-windows-msvc

      # Without --skip-build this also builds the server, web client, and
      # Electron main. Updates are read from this repository's releases.
      - name: Build installer
        shell: bash
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          T3CODE_TELEMETRY_CHANNEL: dev
        run: node scripts/build-desktop-artifact.ts --platform win --target nsis --arch x64 --build-version "$VERSION" --verbose

      # A .rbz is a zip with the loader and its folder at the root. 7-Zip writes
      # forward-slash entry names, which SketchUp on macOS also needs.
      - name: Package SketchUp extension
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/release/T3CodeCadBridge.rbz"
          rm -f "$out"
          cd apps/server/src/cad/hosts/sketchup
          7z a -tzip "$out" t3_cad_bridge.rb t3_cad_bridge
          7z l "$out"

      - name: List release files
        id: files
        shell: bash
        run: |
          set -euo pipefail
          exe="release/T3-Code-$VERSION-x64.exe"
          for file in "$exe" "$exe.blockmap" release/latest.yml release/T3CodeCadBridge.rbz; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing $file."
              ls -la release
              exit 1
            fi
          done
          echo "exe=$exe" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t3code-cad-windows-x64-${{ inputs.version }}
          path: |
            ${{ steps.files.outputs.exe }}
            ${{ steps.files.outputs.exe }}.blockmap
            release/latest.yml
            release/T3CodeCadBridge.rbz
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXE: ${{ steps.files.outputs.exe }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          T3 Code with AutoCAD and SketchUp tools for agents. Setup and usage: [CAD tools](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/docs/user/cad.md).

          - **T3-Code-${VERSION}-x64.exe**: Windows installer.
          - **T3CodeCadBridge.rbz**: SketchUp extension, for installing by hand through Extension Manager. T3 Code can also install it for you.

          This build is not code signed. If Windows SmartScreen blocks the installer, choose **More info**, then **Run anyway**.
          EOF
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "T3 Code CAD v$VERSION" \
            --notes-file "$notes" \
            "$EXE" "$EXE.blockmap" release/latest.yml release/T3CodeCadBridge.rbz
